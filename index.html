<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Uppdrag 58</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred card at a time, like a range scorecard on an oak cask. Single dark theme by choice. */
:root {
  --cask: #2a1c14;
  --cask-2: #3a281d;
  --amber: #d9902f;
  --amber-soft: #f0c27a;
  --paper: #f3e7d3;
  --muted: #bfa88c;
  --hit: #8fbf6a;
  --miss: #e07a5f;
  --display: "Zilla Slab", Georgia, serif;
  --body: "Work Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--cask-2), var(--cask) 70%);
  background-color: var(--cask);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--amber-soft);
}
h1, h2 {
  font-family: var(--display);
  font-weight: 700;
  margin: 0;
  text-wrap: balance;
  line-height: 1.1;
}
h1 { font-size: clamp(34px, 9vw, 46px); }
h2 { font-size: clamp(24px, 6vw, 30px); }
p { margin: 0; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.gap { flex-basis: 100%; height: 0; }
.tile {
  width: 40px; height: 50px;
  display: grid; place-items: center;
  border: 2px solid var(--cask-2);
  border-bottom-color: var(--amber);
  font-family: var(--display);
  font-size: 30px; font-weight: 700;
  color: var(--amber);
  background: rgba(0,0,0,0.18);
  border-radius: 4px;
}
.tile.on { border-color: var(--amber); animation: pop 0.4s ease-out; }
@keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.target { width: 84px; height: 84px; align-self: center; }
.options { display: grid; gap: 10px; }
button, input {
  font: inherit;
  border-radius: 6px;
}
.opt, .primary {
  text-align: left;
  padding: 14px 16px;
  border: 1.5px solid var(--cask-2);
  background: rgba(243,231,211,0.06);
  color: var(--paper);
  cursor: pointer;
  font-weight: 500;
}
.opt:hover { border-color: var(--amber); }
.opt:focus-visible, .primary:focus-visible, input:focus-visible { outline: 3px solid var(--amber-soft); outline-offset: 2px; }
.opt.wrong { border-color: var(--miss); opacity: 0.6; }
.opt.right { border-color: var(--hit); background: rgba(143,191,106,0.15); }
.primary {
  text-align: center;
  background: var(--amber);
  border-color: var(--amber);
  color: var(--cask);
  font-weight: 600;
}
input {
  padding: 14px 16px;
  border: 1.5px solid var(--cask-2);
  background: rgba(0,0,0,0.25);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 22px;
  letter-spacing: 0.3em;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}
.feedback { min-height: 3em; font-weight: 500; }
.feedback.hit { color: var(--hit); }
.feedback.miss { color: var(--miss); }
.progress { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
.gift {
  border: 2px dashed var(--amber);
  border-radius: 8px;
  padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.gift ul { margin: 0; padding-left: 20px; color: var(--paper); }
.sign { font-family: var(--display); font-size: 20px; color: var(--amber-soft); }
.brief { display: flex; gap: 12px; align-items: flex-start; }
.brief svg { flex: 0 0 72px; width: 72px; height: 72px; }
.bubble {
  min-width: 0;
  background: rgba(243,231,211,0.08);
  border: 1.5px solid var(--cask-2);
  border-radius: 4px 12px 12px 12px;
  padding: 10px 12px;
  color: var(--paper);
  font-size: 15px;
}
.bubble b { color: var(--amber-soft); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-bottom: 2px; font-weight: 500; }
.log {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--hit);
  background: rgba(0,0,0,0.35);
  border-left: 3px solid var(--hit);
  padding: 8px 10px;
  white-space: pre-wrap;
}
.stamp {
  align-self: center;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--miss);
  border: 2px solid var(--miss);
  padding: 4px 10px;
  transform: rotate(-4deg);
}
.friends { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.friend {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,0.22);
  border: 1px solid var(--cask-2);
  border-radius: 8px;
  padding: 6px 8px;
  min-width: 0;
}
.friend svg { flex: 0 0 44px; width: 44px; height: 44px; }
.friend span { font-size: 12px; color: var(--muted); line-height: 1.3; min-width: 0; }
canvas#confetti { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .tile.on { animation: none; } }
</style>

<div class="wrap"><main class="card" id="app" aria-live="polite"></main></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
// ---- Ändra här ----
const NAME = "Joakim";    // vännens förnamn
const FROM = "David";
const CODE = "58";        // koden som står på kortet
const VENUE = "Tjoget i Hornstull, Sveriges bästa bar 2026";
// -------------------

const WORD = "REKRYTERAD";

// Original cartoon characters (no real people): the General and Agent C (the AI).
const GEN = `<svg viewBox="0 0 72 72" aria-label="Generalen">
  <rect x="14" y="4" width="44" height="20" rx="6" fill="#5b4636"/>
  <rect x="10" y="18" width="52" height="8" rx="4" fill="#4a3829"/>
  <circle cx="36" cy="10" r="4" fill="#c0392b"/>
  <ellipse cx="36" cy="40" rx="20" ry="18" fill="#e8c9a8"/>
  <rect x="18" y="33" width="15" height="8" rx="3" fill="#111"/>
  <rect x="39" y="33" width="15" height="8" rx="3" fill="#111"/>
  <rect x="33" y="35" width="6" height="2" fill="#111"/>
  <path d="M28 50 q8 4 16 0" stroke="#7a4b3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="12" y="58" width="48" height="14" rx="4" fill="#3d5a3d"/>
  <circle cx="24" cy="64" r="3" fill="#d9902f"/><circle cx="32" cy="64" r="3" fill="#c0392b"/></svg>`;
const BOT = `<svg viewBox="0 0 72 72" aria-label="Agent C">
  <line x1="36" y1="4" x2="36" y2="14" stroke="#bfa88c" stroke-width="3"/>
  <circle cx="36" cy="4" r="3.5" fill="#d9902f"/>
  <rect x="12" y="14" width="48" height="40" rx="10" fill="#6d7f8c"/>
  <rect x="18" y="24" width="36" height="14" rx="7" fill="#1d2a33"/>
  <circle cx="28" cy="31" r="3.5" fill="#8fbf6a"/><circle cx="44" cy="31" r="3.5" fill="#8fbf6a"/>
  <rect x="26" y="44" width="20" height="3" rx="1.5" fill="#1d2a33"/>
  <rect x="20" y="58" width="32" height="12" rx="4" fill="#6d7f8c"/></svg>`;
// Background "friends": drawn caricatures, they never speak.
const VLAD = `<svg viewBox="0 0 64 64" aria-label="Vladimir">
  <rect x="12" y="48" width="40" height="16" rx="5" fill="#2c3440"/>
  <path d="M28 48 l4 14 l4 -14 z" fill="#8a1f1f"/>
  <ellipse cx="32" cy="28" rx="15" ry="19" fill="#e9cfb5"/>
  <path d="M18 22 q2 -8 6 -9 M46 22 q-2 -8 -6 -9" stroke="#c9b08a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M23 26 l6 1 M41 26 l-6 1" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="29" r="1.6" fill="#333"/><circle cx="38" cy="29" r="1.6" fill="#333"/>
  <path d="M27 39 h10" stroke="#8a5a4a" stroke-width="2" stroke-linecap="round"/></svg>`;
const DON = `<svg viewBox="0 0 64 64" aria-label="Donald">
  <rect x="12" y="48" width="40" height="16" rx="5" fill="#1f2a44"/>
  <path d="M29 48 l3 16 l3 -16 z" fill="#d32f2f"/>
  <ellipse cx="32" cy="30" rx="15" ry="18" fill="#f2a46b"/>
  <path d="M15 22 q4 -14 20 -12 q14 2 14 10 q-10 -6 -22 0 q-6 2 -12 2 z" fill="#f4d35e"/>
  <ellipse cx="26" cy="30" rx="3" ry="2" fill="#fbe3c8"/><ellipse cx="38" cy="30" rx="3" ry="2" fill="#fbe3c8"/>
  <circle cx="26" cy="30" r="1.3" fill="#333"/><circle cx="38" cy="30" r="1.3" fill="#333"/>
  <ellipse cx="32" cy="40" rx="4" ry="2.5" fill="#a0453a"/></svg>`;
const friends = (a, b) => `<div class="friends">
  <div class="friend">${VLAD}<span>${a}</span></div>
  <div class="friend">${DON}<span>${b}</span></div></div>`;
const say = (who, text) => `<div class="brief">${who === "bot" ? BOT : GEN}<div class="bubble"><b>${who === "bot" ? "Agent C · AI" : "Generalen"}</b>${text}</div></div>`;

// One log line per question, shown after a correct answer.
const LOG = [
  "> Informant Maria bekräftad. Generalen antecknar.",
  "> Kunskap om brasiliansk sprit registrerad i databasen.",
  "> Mojito-ingredienser loggade. Underlaget växer.",
  "> Gästernas tidslinje bekräftad. 1968 sparat.",
  "> Norrlandskarta laddad. Generalen nickar.",
  "> AIESEC-arkivet 1993–94 öppnat. Intressant.",
  "> Lösenord dekrypterat: ********. Snyggt valt, Joakim.",
  "> SMS-arkivet öppnat. Mest bilder på pistoler.\n> Donald gillade ditt svar. Ignorera honom.",
  "> Bonsai-profil skapad. Generalen gillar tålamod.",
  ""
];
const LETTERS = WORD.replace(/ /g, "").length;
const target = `<svg class="target" viewBox="0 0 84 84" aria-hidden="true">
  <circle cx="42" cy="42" r="40" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="42" cy="42" r="29" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="42" cy="42" r="18" fill="none" stroke="var(--amber)" stroke-width="2"/>
  <circle cx="42" cy="42" r="7" fill="var(--amber)"/></svg>`;

// who: "maria" | "gaster" | "joakim". A new "who" shows a hand-the-phone screen first.
const WHO = {
  maria: { label: "Maria", title: "Ge telefonen till Maria", text: "Kamrat Maria. Du är vår första informant. Tre frågor. Bara första svaret räknas." },
  gaster: { label: "Gästerna", title: "Ge telefonen till gästerna", text: "Gäster. Ni är nu informanter. Svara tillsammans, högt. Fel svar noteras i ert register." },
  joakim: { label: "Joakim", title: "Tillbaka till Joakim", text: "Kamrat Joakim. Vi vet redan mycket om dig. Nu testar vi resten. Varje svar går rakt in i databasen." }
};

const Q = [
  { who: "maria", q: "Joakim och David drack en drink i Rio. Vilken?",
    o: ["Mojito", "Caipirinha", "Piña colada", "Margarita"], a: 1,
    miss: ["Fel land. Den drack ni på Kuba.", "", "Nej, för söt för dem.", "Nej, den är mexikansk."],
    hit: "Rätt. Caipirinha." },
  { who: "maria", q: "Vilken sprit är basen i en caipirinha?",
    o: ["Vit rom", "Cachaça", "Tequila", "Pisco"], a: 1,
    miss: ["Nära, men nej. Den är gjord på melass, inte färsk sockerrörssaft.", "", "Nej, den är mexikansk.", "Nej, den kommer från Peru och Chile."],
    hit: "Rätt. Cachaça, Brasiliens nationalsprit." },
  { who: "maria", q: "Ni var på Kuba. Vilken av de här finns INTE i en mojito?",
    o: ["Mynta", "Lime", "Gin", "Sodavatten"], a: 2,
    miss: ["Jo, den är halva poängen.", "Jo.", "", "Jo, den toppar drinken."],
    hit: "Rätt. Rom, inte gin." },
  { who: "gaster", q: "Joakim föddes 7 november 1968. Vilken sida av vägen körde man på i Sverige den dagen?",
    o: ["Vänster", "Höger", "Båda, det var övergångsperiod", "Man fick inte köra alls"], a: 1,
    miss: ["Nej. Dagen H var 3 september 1967, fjorton månader innan.", "", "Nej. Bytet skedde på en natt.", "Det gällde bara några timmar på Dagen H."],
    hit: "Rätt. Dagen H var 3 september 1967. Joakim har aldrig sett vänstertrafik i Sverige." },
  { who: "gaster", q: "Joakim är från Norrland. Hur många landskap räknas dit?",
    o: ["5", "7", "9", "11"], a: 2,
    miss: ["Fler.", "Fler.", "", "Färre."],
    hit: "Rätt. Nio, från Gästrikland till Lappland." },
  { who: "gaster", q: "Vilka år var Joakim aktiv i AIESEC Sverige?",
    o: ["1989–90", "1991–92", "1993–94", "1995–96"], a: 2,
    miss: ["För tidigt.", "Nära.", "", "För sent."],
    hit: "Rätt. 1993–94." },
  { who: "joakim", q: "Du var med i AIESEC. Vilket år grundades organisationen?",
    o: ["1948", "1958", "1968", "1978"], a: 0,
    miss: ["", "Tio år för sent.", "Tjugo år för sent.", "Trettio år för sent."],
    hit: "Rätt. 1948." },
  { who: "joakim", q: "Din lilla Glock har en förfader. Vilket år kom Glock 17?",
    o: ["1975", "1982", "1988", "1991"], a: 1,
    miss: ["För tidigt. Glock gjorde gardinstänger och knivar då.", "", "För sent.", "För sent."],
    hit: "Rätt. 1982, för österrikiska armén." },
  { who: "joakim", q: "Din nya hobby. Vad betyder ordet bonsai ordagrant?",
    o: ["Litet träd", "Plantering i fat", "Tålamodets träd", "Gammal själ"], a: 1,
    miss: ["Nej, även om det är vad det är.", "", "Fint, men nej.", "Poetiskt, men nej."],
    hit: "Rätt. Bon betyder fat, sai betyder plantering." },
  { who: "joakim", q: "Sista frågan. Titta på bokstäverna. Vad är din present?",
    o: ["Ett par strumpor", "En cocktailkurs", "Middag och drinkar för två", "En bonsaisax"], a: 2,
    miss: ["För tråkigt, även för mig.", "Nära. Men vi låter proffsen blanda.", "", "Nej. Tänk något man dricker."],
    hit: "" }
];

let step = -1, answered = 0;
const score = { maria: 0, gaster: 0, joakim: 0 }, total = { maria: 0, gaster: 0, joakim: 0 };
Q.forEach(s => total[s.who]++);
const app = document.getElementById("app");
const hi = NAME ? `, ${NAME}` : "";

function tiles() {
  const shown = answered >= Q.length ? LETTERS : Math.floor(answered * LETTERS / Q.length);
  let n = 0;
  return `<div class="tiles" aria-label="Bokstäver hittills">${[...WORD].map(c => {
    if (c === " ") return `<div class="gap"></div>`;
    const on = n++ < shown;
    return `<div class="tile ${on ? "on" : ""}">${on ? c : ""}</div>`;
  }).join("")}</div>`;
}

function handoff() {
  const w = WHO[Q[step].who];
  app.innerHTML = `
    ${tiles()}
    <div class="eyebrow">Byt spelare</div>
    <h1>${w.title}</h1>
    ${say("gen", w.text)}
    ${friends("Vladimir följer spelet live.", "Donald tittar också. Han förstår inte reglerna.")}
    <button class="primary" id="go">Jag är ${w.label === "Gästerna" ? "gäst" : w.label}. Kör.</button>`;
  const b = document.getElementById("go");
  b.addEventListener("click", ask); b.focus();
}

function next() {
  const prev = Q[step - 1];
  if (!prev || prev.who !== Q[step].who) handoff(); else ask();
}

function login() {
  app.innerHTML = `
    <div class="stamp">TOPPHEMLIGT</div>
    <div class="eyebrow">Operation 58</div>
    <h1>Grattis på födelsedagen${hi}!</h1>
    ${say("gen", "Generalen här. Jag och AI-agenten Claude har fått ett uppdrag från David. Vi ska hjälpa dig att hitta din present.")}
    ${say("bot", "Den här sessionen loggas. Logga in med koden på kortet.")}
    ${friends("Vladimir har skickat en vänförfrågan.", "Donald också. Tyvärr.")}
    <form id="f" style="display:grid;gap:10px">
      <label for="code" class="eyebrow">Kod: din ålder i dag (två siffror)</label>
      <input id="code" inputmode="numeric" autocomplete="off" maxlength="4">
      <button class="primary" type="submit">Logga in</button>
    </form>
    <div class="feedback" id="fb"></div>`;
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("code").value.trim();
    if (v === CODE) { step = 0; next(); }
    else {
      const fb = document.getElementById("fb");
      fb.className = "feedback miss";
      fb.textContent = "Fel kod. Generalen är besviken. Tips: hur gammal blir du?";
    }
  });
}

function ask() {
  const s = Q[step];
  app.innerHTML = `
    ${tiles()}
    ${target}
    <div class="eyebrow">${WHO[s.who].label} svarar · fråga ${step + 1} av ${Q.length}</div>
    <h2>${s.q}</h2>
    <div class="options">${s.o.map((t, i) => `<button class="opt" id="o${step}-${i}" data-i="${i}">${t}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(b)));
}

function pick(b) {
  const s = Q[step], i = +b.dataset.i, fb = document.getElementById("fb");
  if (i !== s.a) {
    b.classList.add("wrong"); b.disabled = true; s.missed = true;
    fb.className = "feedback miss"; fb.textContent = s.miss[i];
    return;
  }
  if (!s.missed) score[s.who]++;
  b.classList.add("right");
  app.querySelectorAll(".opt").forEach(x => x.disabled = true);
  answered++;
  app.querySelector(".tiles").outerHTML = tiles();
  if (step === Q.length - 1) { setTimeout(reveal, 700); return; }
  fb.className = "feedback hit"; fb.textContent = s.hit;
  if (LOG[step]) {
    const lg = document.createElement("div");
    lg.className = "log"; lg.textContent = LOG[step];
    app.appendChild(lg);
  }
  const nb = document.createElement("button");
  nb.className = "primary"; nb.textContent = "Nästa";
  nb.addEventListener("click", () => { step++; next(); });
  app.appendChild(nb); nb.focus();
}

function reveal() {
  app.innerHTML = `
    ${tiles()}
    <div class="stamp">REKRYTERAD</div>
    <h1>Välkommen in, Agent Joakim.</h1>
    ${say("gen", "Databasen är full. Vi har bestämt oss. Du rekryteras. Rekryteringssamtalet sker över middag och riktigt bra drinkar. Generalen bjuder.")}
    ${say("bot", "Rättelse: David betalar. Generalen har inga kronor.")}
    ${friends("Vladimir har accepterat er vänskap.", "Donald vill följa med på middagen. Svaret är nej.")}
    <div class="gift">
      <div class="eyebrow">Din present</div>
      <ul>
        <li>Middag för två med riktigt bra cocktails${VENUE ? ` på ${VENUE}` : ""}.</li>
        <li>Caipirinha i Rio, mojito på Kuba, gin hos dig. Nu är det min tur att bjuda.</li>
      </ul>
      <p>Vi väljer kväll tillsammans. Ring David så bokar ni. Använd inte telefonen, den är avlyssnad.</p>
    </div>
    <div class="gift">
      <div class="eyebrow">Resultat, rätt på första försöket</div>
      <ul>
        <li>Maria: ${score.maria} av ${total.maria}</li>
        <li>Gästerna: ${score.gaster} av ${total.gaster}</li>
        <li>Joakim: ${score.joakim} av ${total.joakim}</li>
      </ul>
    </div>
    <div class="sign">Grattis på 58-årsdagen! /${FROM}, Generalen och Agent C</div>`;
  confetti();
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#d9902f", "#f0c27a", "#f3e7d3", "#8fbf6a", "#e07a5f"];
  const p = Array.from({ length: 140 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5,
    vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
    r: 4 + Math.random() * 5, col: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6
  }));
  let t = 0;
  (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    p.forEach(o => {
      o.x += o.vx; o.y += o.vy; o.a += 0.1;
      x.fillStyle = o.col;
      x.fillRect(o.x, o.y, o.r, o.r * Math.abs(Math.sin(o.a)) + 1);
    });
    if (++t < 260) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}

login();
</script>

</html>
